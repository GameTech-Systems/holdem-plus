name: Equity simulation

on:
  workflow_dispatch:
    inputs:
      hu_trials:
        description: Deals per hand, heads-up
        default: "300000"
      six_trials:
        description: Deals per hand, 6-handed
        default: "150000"
      seed:
        description: RNG seed
        default: "88172645463325252"
  pull_request:
    paths: ["sim/**", ".github/workflows/equity-sim.yml"]
  push:
    branches: [main]
    paths: ["sim/**", ".github/workflows/equity-sim.yml"]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build simulator
        run: gcc -O2 -Wall -o equity sim/holdem_plus_equity.c
      - name: Cross-check evaluator against hand_evaluator.py
        run: python sim/cross_check.py ./equity 20000
      - name: Run simulation
        run: |
          ./equity --hu-trials "${{ inputs.hu_trials || '300000' }}" \
                   --six-trials "${{ inputs.six_trials || '150000' }}" \
                   --seed "${{ inputs.seed || '88172645463325252' }}" > results.json
      - name: Sanity-check against known Texas Hold'em equities and summarize
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("results.json"))
          R = "AKQJT98765432"
          def at(a, name):
              i, j = R.index(name[0]), R.index(name[1])
              return a[i*13+j] if name[0] == name[1] or name.endswith("s") else a[j*13+i]
          known = {"AA": 85.2, "KK": 82.4, "AKs": 67.1, "AKo": 65.2, "72o": 34.6}
          print("| Hand | Hold'em HU (sim) | Known | Plus HU | Hold'em 6-max | Plus 6-max |\n|---|---|---|---|---|---|")
          for n, k in known.items():
              h = at(d["hu"]["h"], n)
              assert abs(h - k) < 1.0, f"{n}: simulated {h}, expected about {k}"
              print(f"| {n} | {h} | {k} | {at(d['hu']['p'], n)} | {at(d['six']['h'], n)} | {at(d['six']['p'], n)} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: equity-results
          path: results.json
